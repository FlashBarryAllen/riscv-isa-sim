tcl port disabled
telnet port disabled

adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 9824

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0xdeadbeef

target create $_CHIPNAME.cpu0 riscv -chain-position $_CHIPNAME.cpu -coreid 0
$_CHIPNAME.cpu0 configure -gdb-port 50000

target create $_CHIPNAME.cpu1 riscv -chain-position $_CHIPNAME.cpu -coreid 1
$_CHIPNAME.cpu1 configure -gdb-port 70001

target create $_CHIPNAME.cpu2 riscv -chain-position $_CHIPNAME.cpu -coreid 2
$_CHIPNAME.cpu2 configure -gdb-port 70002

target create $_CHIPNAME.cpu3 riscv -chain-position $_CHIPNAME.cpu -coreid 3
$_CHIPNAME.cpu3 configure -gdb-port 70003

gdb report_data_abort enable

init
riscv.cpu0 arm semihosting enable
riscv.cpu1 arm semihosting enable
riscv.cpu2 arm semihosting enable
riscv.cpu3 arm semihosting enable
halt
