# Spike 多核 OpenOCD 配置文件
# 用于通过 remote_bitbang 接口连接 Spike 模拟器的多核 RISC-V 目标
tcl port disabled
telnet port disabled

adapter driver remote_bitbang
remote_bitbang host localhost
remote_bitbang port 9824

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0xdeadbeef

# 定义多核目标 (hart 0 和 hart 1)
set _TARGETNAME_0 $_CHIPNAME.cpu0
set _TARGETNAME_1 $_CHIPNAME.cpu1

# 创建核心 0 目标 (hart 0)
target create $_TARGETNAME_0 riscv -chain-position $_CHIPNAME.cpu -coreid 0 -rtos hwthread

# 创建核心 1 目标 (hart 1)  
target create $_TARGETNAME_1 riscv -chain-position $_CHIPNAME.cpu -coreid 1

# 将两个核心加入 SMP 组，实现同步控制
target smp $_TARGETNAME_0 $_TARGETNAME_1

gdb report_data_abort enable

init
arm semihosting enable

# 默认选择核心 0
targets $_TARGETNAME_0
halt